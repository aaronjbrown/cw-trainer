[platformio]
default_envs = esp32dev

[env]
test_framework = unity
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
test_filter = test_storage, test_player

[env:native]
platform = native
test_ignore = test_storage, test_player
